<style>
    .signup-form .form-label {
        display: block;
        text-align: left;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
    }
    .signup-form .reqd-star {
        color: #e20a0a;
    }
</style>

<form class="signup-form" role="form">
    <div class="page-card-body">
        <div class="form-group">
            <label class="form-label" for="signup_fullname">{{ _("Full Name") }} <span class="reqd-star">*</span></label>
            <input type="text" id="signup_fullname" class="form-control"
                placeholder="{{ _('Full Name') }}" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_email">{{ _("Email ID") }} <span class="reqd-star">*</span></label>
            <input type="email" id="signup_email" class="form-control"
                placeholder="{{ _('Email ID') }}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_mobile">{{ _("Mobile Number") }} <span class="reqd-star">*</span></label>
            <input type="tel" id="signup_mobile" class="form-control"
                placeholder="{{ _('Mobile Number') }}" pattern="[+0-9\s\-]{7,20}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_address">{{ _("Address") }}</label>
            <textarea id="signup_address" class="form-control" rows="2"
                placeholder="{{ _('Address (optional)') }}"></textarea>
        </div>
    </div>
    <div class="page-card-actions">
        <button class="btn btn-sm btn-primary btn-block btn-signup"
            type="submit">{{ _("Sign up") }}</button>

        <p class="text-center sign-up-message">
            <a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
        </p>
    </div>
</form>

<script>
    frappe.ready(function () {
        $(".signup-form").on("submit", (e) => {
            signup(e);
        });
    });

    const signup = (e) => {
        e.preventDefault();
        const email = ($("#signup_email").val() || "").trim();
        const full_name = frappe.utils.xss_sanitise(($("#signup_fullname").val() || "").trim());
        const mobile_no = ($("#signup_mobile").val() || "").trim();
        const address = ($("#signup_address").val() || "").trim();

        if (!email || !validate_email(email) || !full_name) {
            login.set_status('{{ _("Valid email and name required") }}', 'red');
            return false;
        }

        const digits = mobile_no.replace(/\D/g, "");
        if (digits.length < 7 || digits.length > 15) {
            login.set_status('{{ _("Please enter a valid mobile number") }}', 'red');
            return false;
        }

        frappe.call({
            method: "quality_asia_lms.overrides.signup.sign_up",
            args: {
                "email": email,
                "full_name": full_name,
                "mobile_no": mobile_no,
                "address": address
            },
            statusCode: login.login_handlers
        })
        return false;
    }
</script>
